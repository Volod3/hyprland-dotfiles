# Згенеровано застосунком «Налаштування» (Win+I) → Живлення. Перезаписується.
general {
    lock_cmd = /home/voltimeter/.config/wallpapers_QS/tools/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/A*/online 2>/dev/null | head -n1)" = 1 ] || systemctl suspend'
}
