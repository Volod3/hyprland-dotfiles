shell /usr/bin/fish

# --- Font ---
font_family      Fira Code
font_size 12.0

# --- Вікно: синя прозорість + blur (blur потрібен новіший kitty, 0.43+) ---
window_padding_width 15
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
background             #0f1a3a
background_opacity 0.80
background_blur       80

# --- Cursor ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_trail 1

# --- Стабільність ---
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
shell_integration enabled
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- Копіювання / вставка ---
copy_on_select no
strip_trailing_spaces smart
map ctrl+c copy_or_interrupt
# Ctrl+V: розумна вставка (великий текст трохи зменшує шрифт, щоб влізти у вікно)
map ctrl+v kitten smartpaste.py
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
# Скинути розмір шрифту: Ctrl+Shift+Backspace (стандартна комбінація kitty)

# --- Контекстне меню на праву кнопку ---
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
# правий клік — меню Quickshell (KittyMenu.qml у bg_clipboard). $PPID = pid kitty → його сокет керування;
# @active-kitty-window-id і @selection kitty підставляє сам
mouse_map right press ungrabbed launch --type=background sh -c 'exec qs -p "$HOME/.config/wallpapers_QS/bg_clipboard/shell.qml" ipc call kittymenu open "unix:@kitty-$PPID" "$1" "$2"' kittymenu @active-kitty-window-id @selection

# --- Scrollbar (kitty 0.43+) ---
scrollbar scrolled-and-hovered
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 0.4
scrollbar_hover_width 0.9
scrollbar_radius 0.5
scrollbar_gap 0.15
scrollbar_min_handle_height 2
scrollbar_handle_color #89b4fa
scrollbar_handle_opacity 0.5
scrollbar_track_opacity 0

# --- Colors (Catppuccin Mocha на синьому фоні) ---
foreground             #cdd6f4
selection_foreground   #0f1a3a
selection_background   #89b4fa

cursor                 #89b4fa
url_color              #89b4fa
active_border_color    #89b4fa
inactive_border_color  #45475a

color0                 #45475a
color8                 #585b70
color1                 #f38ba8
color9                 #f38ba8
color2                 #a6e3a1
color10                #a6e3a1
color3                 #f9e2af
color11                #f9e2af
color4                 #89b4fa
color12                #89b4fa
color5                 #b4befe
color13                #b4befe
color6                 #89dceb
color14                #89dceb
color7                 #bac2de
color15                #a6adc8

# --- Fixed font size ---
map ctrl+shift+minus no_op
map ctrl+shift+equal no_op
map ctrl+shift+plus no_op
map ctrl+minus no_op
map ctrl+equal no_op
map ctrl+plus no_op
map ctrl+kp_subtract no_op
map ctrl+kp_add no_op
map ctrl+shift+backspace no_op
startup_session startup.session
# Рідний Wayland. Раніше тут було x11 (з налаштувань KDE): kitty йшов через Xwayland і бувало,
# що текст не відображався, натискання губились (особливо після зміни розкладки), гуляв фокус.
linux_display_server auto

# кольори поточної теми робочого столу (генерує ~/.config/wallpapers_QS/tools/theme)
include theme-colors.conf
